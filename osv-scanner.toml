[[IgnoredVulns]]
id = "GHSA-72xf-g2v4-qvf3"
reason = "tough-cookie@2.5.0 is a transitive dep of request -> octonode -> @endbug/github-label-sync (at latest version). The prototype pollution requires parsing attacker-controlled Set-Cookie headers. GitHub API responses do not set cookies, and our code does not use a cookie jar or process any cookie values."

[[IgnoredVulns]]
id = "GHSA-w5hq-g745-h8pq"
reason = "uuid@3.4.0 is a transitive dep of request -> octonode -> @endbug/github-label-sync (at latest version). The buffer bounds vulnerability requires passing a buf parameter to uuid v3/v5/v6 generation. request uses uuid only for multipart form boundaries, which our code never triggers since all octonode calls are GET requests."
